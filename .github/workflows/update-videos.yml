name: Update Videos (transition fallback)
on:
  schedule:
    # Retained until unified runs are verified; disable via LEGACY_VIDEO_CRON_DISABLED=true.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Wikiを書き換えない)'
        type: boolean
        default: true
      batch_size:
        description: '1回の処理ライバー数 (1〜52)'
        default: '5'
      days_back:
        description: '再確認する過去日数'
        default: '14'
permissions:
  contents: read
concurrency:
  group: wiki-writer
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.LEGACY_VIDEO_CRON_DISABLED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    env:
      VIDEO_WIKI_WRITE_ENABLED: ${{ vars.VIDEO_WIKI_WRITE_ENABLED || 'false' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || github.event_name == 'schedule' && vars.VIDEO_WIKI_WRITE_ENABLED == 'true' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - run: npm test
      - name: Load durable video state
        id: state
        run: bash ops/state/sync-state.sh load
      - name: Update due channels
        env:
          CLASSIFIER_INGEST_BATCH_SIZE: ${{ vars.CLASSIFIER_INGEST_BATCH_SIZE || '10' }}
          CLASSIFIER_CUSTODY_READ_ENABLED: ${{ vars.CLASSIFIER_CUSTODY_READ_ENABLED || 'false' }}
          CLASSIFIER_CUSTODY_ENABLED: ${{ vars.CLASSIFIER_CUSTODY_ENABLED || 'false' }}
          CLASSIFIER_URL: ${{ vars.CLASSIFIER_URL }}
          CLASSIFIER_SYNC_TOKEN: ${{ secrets.CLASSIFIER_SYNC_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          WIKI_API_BASE_URL: ${{ secrets.WIKI_API_BASE_URL }}
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
          BATCH_SIZE: ${{ inputs.batch_size || '5' }}
          DAYS_BACK: ${{ inputs.days_back || '14' }}
        run: npm run update
      - name: Save durable video state
        if: always() && steps.state.outcome == 'success'
        run: bash ops/state/sync-state.sh save
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-preview-${{ github.run_id }}
          path: work/
          retention-days: 7
