name: Sync stream schedule
run-name: ${{ (github.event_name == 'schedule' || inputs.periodic) && '[periodic]' || '[interactive]' }} ${{ github.workflow }}

on:
  schedule:
    - cron: '4-54/10 * * * *'
  workflow_dispatch:
    inputs:
      periodic:
        description: 'External scheduler: use scheduled collection semantics'
        type: boolean
        default: false
      dry_run:
        description: 'Dry Run (Wikiを書き換えない)'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'ops/state/**'
      - 'ops/classifier/**'
      - '.github/workflows/update-videos.yml'
      - 'tests/schedule/**'
      - '.github/workflows/sync-stream-schedule.yml'
      - 'package*.json'
      - 'ops/scheduler/**'
permissions:
  contents: read
concurrency:
  group: wiki-writer${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - run: npm test
      - run: npm run schedule:demo
      - uses: actions/upload-artifact@v4
        with:
          name: stream-schedule-demo
          path: work/
          retention-days: 7
  classifier-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run classifier:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classifier-validation-${{ github.run_id }}
          path: work/
          retention-days: 7
  sync:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'schedule' || vars.SCHEDULE_DRIVER != 'cloudflare') && (github.event_name != 'workflow_dispatch' || !inputs.periodic || vars.SCHEDULE_DRIVER == 'cloudflare')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    env:
      VIDEO_WIKI_WRITE_ENABLED: ${{ vars.VIDEO_WIKI_WRITE_ENABLED || 'false' }}
      UNIFIED_VIDEOS_ENABLED: ${{ vars.UNIFIED_VIDEOS_ENABLED || 'false' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.periodic && (inputs.dry_run && 'true' || 'false') || vars.WIKI_WRITE_ENABLED != 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: Load durable video state
        id: state
        run: bash ops/state/sync-state.sh load
      - name: Generate previews and optionally sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          WIKI_API_BASE_URL: ${{ secrets.WIKI_API_BASE_URL }}
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
          CLASSIFIER_CUSTODY_BATCH_SIZE: ${{ vars.CLASSIFIER_CUSTODY_BATCH_SIZE || '10' }}
          CLASSIFIER_INGEST_BATCH_SIZE: ${{ vars.CLASSIFIER_INGEST_BATCH_SIZE || '10' }}
          CLASSIFIER_CUSTODY_READ_ENABLED: ${{ vars.CLASSIFIER_CUSTODY_READ_ENABLED || 'false' }}
          CLASSIFIER_CUSTODY_ENABLED: ${{ vars.CLASSIFIER_CUSTODY_ENABLED || 'false' }}
          CLASSIFIER_SYNC_ENABLED: ${{ vars.CLASSIFIER_SYNC_ENABLED || 'false' }}
          CLASSIFIER_URL: ${{ vars.CLASSIFIER_URL }}
          CLASSIFIER_SYNC_TOKEN: ${{ secrets.CLASSIFIER_SYNC_TOKEN }}
          WIKI_WRITE_ENABLED: ${{ vars.WIKI_WRITE_ENABLED || 'false' }}
        run: npm run sync
      - name: Save durable video state
        if: always() && steps.state.outcome == 'success' && (env.UNIFIED_VIDEOS_ENABLED == 'true' || vars.CLASSIFIER_SYNC_ENABLED == 'true')
        run: bash ops/state/sync-state.sh save
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stream-schedule-preview-${{ github.run_id }}
          path: work/
          if-no-files-found: ignore
          retention-days: 7
